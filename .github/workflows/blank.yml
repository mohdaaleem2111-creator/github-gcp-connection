
name: Test GCP Connection

on:
  push:
    branches:
      - main

jobs:
  test-connection:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - id: auth
        name: Authentication to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WLIF_PROVIDER }}
          service_account: ${{ secrets.WLIF_SERVICE_ACCOUNT }}

      - name: Verify Connection
        run: |
          gcloud auth list
          gcloud config list
          echo "Connection is successfully created."
